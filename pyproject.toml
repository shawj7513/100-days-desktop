[project]
name = "100-days-desktop"
version = "0.1.0"
description = "Offline Windows desktop tracker for a 100-day course, with timed sessions"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "pywebview>=6.2.1",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
]
